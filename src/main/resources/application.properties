spring.application.name=persona-api
server.port=${SERVER_PORT:8084}

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_persona}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true

# Servicio notificaciones
uri.service.notificaciones=${URI_SERVICE_NOTIFICACIONES:http://localhost:8086}
