spring.application.name=persona-api
server.port=8084

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_persona
spring.datasource.username=root
spring.datasource.password=

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true

#Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Nombre del topic en Kafka
topico.registro-persona=registro-persona-topico